<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ミニ四駆コントローラー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="DISCONNECTED">
  <!-- 車載カメラ映像 -->
  <img id="camera" src="/video_feed" alt="Camera Stream" crossorigin="anonymous">

  <!-- タッチ操作ゾーン -->
  <div id="touch-zone">
    <div id="joystick" hidden>
      <div id="joystick-thumb"></div>
    </div>
  </div>

  <!-- HUD ヘッダー (状態 / 距離 / INFO) -->
  <header class="top-bar">
    <div id="status-badge" class="badge">
      <span class="status-dot"></span>
      <span id="status-text">未接続</span>
    </div>
    <div id="distance-card" class="badge">
      <span class="label">前方距離</span>
      <span id="distance-val" class="val">1200</span>
      <span class="unit">mm</span>
    </div>
    <button popovertarget="info-modal" class="btn btn-sm">INFO</button>
  </header>

  <div id="alert-banner" popover="manual">エラー通知</div>

  <!-- 操作フッター (中断理由 / モード切替 / ABORT) -->
  <footer class="bottom-bar">
    <div id="stop-reason">中断理由: <span id="stop-reason-text">NONE</span></div>
    <div class="action-row">
      <button id="btn-mode" class="action-btn">MANUAL MODE</button>
      <button id="btn-stop" class="action-btn btn-stop">ABORT</button>
    </div>
  </footer>

  <!-- TOR オーバーレイ -->
  <div id="tor-overlay" class="overlay">
    <div class="card tor-card">
      <h2>TAKE OVER REQUEST</h2>
      <p>自動運転の継続が困難です。手動操作へ引き継いでください。</p>
      <div class="timer">残り時間: <span id="tor-countdown">3.0</span> 秒</div>
      <button id="btn-takeover" class="btn btn-lg">手動操作に切り替える</button>
    </div>
  </div>

  <!-- 切断オーバーレイ -->
  <div id="disconnected-overlay" class="overlay">
    <div class="card center">
      <div class="spinner"></div>
      <h2>DISCONNECTED</h2>
      <p>サーバーに接続しています...</p>
      <p class="muted">マイコンまたは mock_server.py の起動を確認してください</p>
    </div>
  </div>

  <!-- INFO モーダル -->
  <div id="info-modal" popover class="modal-card">
    <h2>操作・機能ガイド</h2>
    <p class="muted">ミニ四駆コントローラー</p>
    <ul>
      <li><strong>走行操作:</strong> 画面をタッチ＆スワイプ</li>
      <li><strong>自動運転:</strong> AUTO MODE ボタンで切替要求</li>
      <li><strong>手動停止:</strong> ABORT ボタンで即時停止</li>
    </ul>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
