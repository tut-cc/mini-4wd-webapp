<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ミニ四駆 コントローラー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 車載カメラ映像 -->
  <img id="camera" src="/video_feed" alt="Camera Stream" crossorigin="anonymous">

  <!-- タッチ操作ゾーン & 仮想ジョイスティック -->
  <div id="touch-zone">
    <div id="joystick" class="hidden">
      <div id="joystick-thumb"></div>
    </div>
  </div>

  <!-- HUD ヘッダー (状態 / 距離) -->
  <header class="top-bar">
    <div id="status-badge" class="badge">
      <span class="status-dot"></span>
      <span id="status-text">接続中</span>
    </div>
    <div id="distance-card" class="badge">
      <span class="label">前方距離</span>
      <span id="distance-val" class="val">1200</span>
      <span class="unit">mm</span>
    </div>
  </header>

  <!-- アラート通知 -->
  <div id="alert-banner" class="hidden">エラー通知</div>

  <!-- 操作フッター (停止理由 / モード切替 / STOP) -->
  <footer class="bottom-bar">
    <div id="stop-reason" class="hidden">停止理由: <span id="stop-reason-text">NONE</span></div>
    <div class="action-row">
      <button id="btn-mode" class="action-btn">MANUAL MODE</button>
      <button id="btn-stop" class="action-btn btn-stop">STOP</button>
    </div>
  </footer>

  <!-- TOR (Take Over Request) オーバーレイ -->
  <div id="tor-overlay" class="overlay hidden">
    <div class="card tor-card">
      <h2>TAKE OVER REQUEST</h2>
      <p>自動運転の継続が困難です。手動操作へ引き継いでください。</p>
      <div class="timer">残り時間: <span id="tor-countdown">5.0</span> 秒</div>
      <button id="btn-takeover" class="btn btn-lg">手動操作に切り替える</button>
    </div>
  </div>

  <!-- 切断オーバーレイ -->
  <div id="disconnected-overlay" class="overlay hidden">
    <div class="card center">
      <div class="spinner"></div>
      <h2>DISCONNECTED</h2>
      <p>サーバーに接続しています...</p>
      <p class="muted">マイコンまたは mock_server.py の起動を確認してください</p>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
